services:
  api:
    build: ./api
    container_name: met4-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RUSENDER_KEY=${RUSENDER_KEY}
      - RUSENDER_KEY_ID=${RUSENDER_KEY_ID}
      - FRONTEND_ORIGIN=https://met4.ru
      - DB_PATH=/data/db.sqlite
      - LEAD_INBOX=${LEAD_INBOX:-bolkunatz@gmail.com}
    volumes:
      - sqlite_data:/data
    networks:
      - met4-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: met4-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - met4-net
    depends_on:
      - api

volumes:
  sqlite_data:

networks:
  met4-net:
    driver: bridge

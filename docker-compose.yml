services:
  api:
    build: ./api
    container_name: met4-api
    restart: unless-stopped
    environment:
      - RESEND_KEY=${RESEND_KEY}
      - FRONTEND_ORIGIN=https://met4.ru
      - DB_PATH=/data/db.sqlite
    volumes:
      - sqlite_data:/data
    networks:
      - met4-net
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: met4-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro
    networks:
      - met4-net
    depends_on:
      - api

volumes:
  sqlite_data:

networks:
  met4-net:
    driver: bridge

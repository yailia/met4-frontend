server {
    listen 80;
    server_name met4.ru www.met4.ru api.met4.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name met4.ru www.met4.ru;

    ssl_certificate /etc/letsencrypt/live/met4.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/met4.ru/privkey.pem;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.met4.ru;

    ssl_certificate /etc/letsencrypt/live/met4.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/met4.ru/privkey.pem;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

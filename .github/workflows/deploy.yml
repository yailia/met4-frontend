name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Serialize deploys so concurrent runs can't race and clobber the frontend dist.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Sharp for Linux
        run: npm install --cpu=x64 --os=linux sharp
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
        env:
          PUBLIC_API_URL: https://api.met4.ru
          PUBLIC_METRIKA_ID: ${{ vars.PUBLIC_METRIKA_ID }}

      - name: Copy frontend dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/app/frontend/dist"
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app
            git pull origin master
            docker-compose build api
            # api runs as user "node"; sqlite volume was created root-owned — idempotent fix
            docker-compose run --rm --user root api chown -R node:node /data
            docker-compose up -d api
            docker-compose restart nginx

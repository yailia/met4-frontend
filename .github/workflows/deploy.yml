name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Serialize deploys so concurrent runs can't race and clobber the frontend dist.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Sharp for Linux
        run: npm install --cpu=x64 --os=linux sharp
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
        env:
          PUBLIC_API_URL: https://api.met4.ru
          PUBLIC_METRIKA_ID: ${{ vars.PUBLIC_METRIKA_ID }}

      - name: Copy frontend dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/app/frontend/dist"
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RUSENDER_KEY: ${{ secrets.RUSENDER_KEY }}
          RUSENDER_KEY_ID: ${{ secrets.RUSENDER_KEY_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_IDS: ${{ vars.OWNER_CHAT_IDS }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          TELEGRAM_PROXY: ${{ secrets.TELEGRAM_PROXY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: RUSENDER_KEY,RUSENDER_KEY_ID,BOT_TOKEN,OWNER_CHAT_IDS,INTERNAL_TOKEN,TELEGRAM_PROXY
          script: |
            cd /app
            git pull origin master
            # sync secrets from GitHub into .env for docker-compose
            touch .env
            sed -i '/^RUSENDER_KEY=/d;/^RUSENDER_KEY_ID=/d;/^BOT_TOKEN=/d;/^OWNER_CHAT_IDS=/d;/^INTERNAL_TOKEN=/d' .env
            printf 'RUSENDER_KEY=%s\nRUSENDER_KEY_ID=%s\n' "$RUSENDER_KEY" "$RUSENDER_KEY_ID" >> .env
            printf 'BOT_TOKEN=%s\nOWNER_CHAT_IDS=%s\nINTERNAL_TOKEN=%s\n' "$BOT_TOKEN" "${OWNER_CHAT_IDS:-152579925}" "$INTERNAL_TOKEN" >> .env
            # only overwrite TELEGRAM_PROXY when the secret is set; otherwise keep the existing .env value
            if [ -n "$TELEGRAM_PROXY" ]; then
              sed -i '/^TELEGRAM_PROXY=/d' .env
              printf 'TELEGRAM_PROXY=%s\n' "$TELEGRAM_PROXY" >> .env
            fi
            # compose interpolates ${TELEGRAM_PROXY} from the shell before .env;
            # clear it so the .env value (set above / manually) always wins
            unset TELEGRAM_PROXY
            docker-compose build api mailbot
            # services run as user "node"; sqlite volumes were created root-owned — idempotent fix
            docker-compose run --rm --user root api chown -R node:node /data
            docker-compose run --rm --user root mailbot chown -R node:node /data
            docker-compose up -d --force-recreate api mailbot
            docker-compose restart nginx
